<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1014"/>
      <stop offset="100%" stop-color="#1A1B22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6AC278"/>
      <stop offset="100%" stop-color="#4A9E5A"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6AC278" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#6AC278" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#6AC278" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Terminal window frame -->
  <g filter="innerGlow">
    <rect x="96" y="120" width="320" height="240" rx="16" fill="#1E1F28" stroke="#6AC278" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Title bar dots -->
    <circle cx="124" cy="144" r="6" fill="#FF5F57"/>
    <circle cx="146" cy="144" r="6" fill="#FEBC2E"/>
    <circle cx="168" cy="144" r="6" fill="#28C840"/>

    <!-- Terminal lines -->
    <g opacity="0.7">
      <!-- Prompt line 1 -->
      <text x="120" y="192" font-family="SF Mono, Menlo, monospace" font-size="18" font-weight="600" fill="#6AC278">$</text>
      <rect x="140" y="180" width="120" height="14" rx="3" fill="#6AC278" opacity="0.25"/>

      <!-- Output line 2 -->
      <rect x="120" y="210" width="200" height="12" rx="3" fill="#ffffff" opacity="0.12"/>

      <!-- Output line 3 -->
      <rect x="120" y="232" width="160" height="12" rx="3" fill="#ffffff" opacity="0.08"/>

      <!-- Cursor line -->
      <text x="120" y="272" font-family="SF Mono, Menlo, monospace" font-size="18" font-weight="600" fill="#6AC278">$</text>
      <rect x="140" y="260" width="10" height="16" rx="2" fill="#6AC278" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Connection waves (sync symbol) -->
  <g filter="shadow" transform="translate(256, 400)">
    <!-- Left wave -->
    <path d="M-40,-8 C-30,-18 -20,-18 -10,-8 C0,2 10,2 20,-8" stroke="#6AC278" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M-30,-8 C-20,-18 -10,-18 0,-8 C10,2 20,2 30,-8" stroke="#6AC278" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M-20,-8 C-10,-18 0,-18 10,-8 C20,2 30,2 40,-8" stroke="#6AC278" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- "V" mark accent -->
  <g filter="shadow" transform="translate(256, 86)">
    <path d="M-22,0 L0,20 L22,0" stroke="#6AC278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
