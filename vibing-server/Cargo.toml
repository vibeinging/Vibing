[package]
name = "vibe-terminal-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# 异步运行时
tokio = { version = "1.42", features = ["full"] }
# CLI 解析
clap = { version = "4.5", features = ["derive"] }

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# PTY
portable-pty = "0.8"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 错误处理
anyhow = "1.0"
thiserror = "2.0"

# 工具库
bytes = "1.0"

# 网络传输
dashmap = "6.1"

# 配置
config = { version = "0.15", features = ["toml"] }
toml = "0.8"

# 加密
aes-gcm = "0.10"
sha2 = "0.10"

# 随机数
rand = "0.8"
